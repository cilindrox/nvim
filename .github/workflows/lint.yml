name: test

# yamllint disable-line rule:truthy
on:
- push
- pull_request

permissions:
  contents: read

jobs:
  lint:
    name: Lint files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.11'

    - name: Install Vint
      run: |
        python -m pip install --upgrade pip
        pip install vim-vint

    - name: Register Vint Problem Matcher
      run: echo "::add-matcher::.github/vint-matcher.json"

    - name: Run Vint Linter
      run: vint .

    - name: Remove Vint Problem Matcher
      if: always()
      run: echo "::remove-matcher owner=vint::"
